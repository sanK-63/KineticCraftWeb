<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="Content-Security-Policy" content="
    default-src 'self';
    script-src 'self' https://unpkg.com https://cdn.jsdelivr.net 'unsafe-eval' 'unsafe-inline';
    style-src 'self' 'unsafe-inline' https://fonts.googleapis.com https://cdnjs.cloudflare.com https://unpkg.com;
    font-src 'self' https://fonts.gstatic.com https://cdnjs.cloudflare.com;
    connect-src 'self' https://*.supabase.co https://api.mcstatus.io;
    img-src 'self' data: https://*.supabase.co https://unpkg.com;
    worker-src 'self' blob:;
">
  <title>KineticCraft — Профиль</title>
  <link rel="stylesheet" href="styles.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link href="https://unpkg.com/aos@2.3.1/dist/aos.css" rel="stylesheet">
  <style>
    .profile-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 20px;
      margin-top: 20px;
    }
    .profile-card {
      background: var(--glass);
      border: 1px solid rgba(255,255,255,0.1);
      border-radius: 12px;
      padding: 25px;
    }
    .skin-viewer {
      width: 100%;
      height: 350px;
      background: rgba(0,0,0,0.3);
      border-radius: 8px;
      overflow: hidden;
    }
    .skin-viewer canvas {
      width: 100%;
      height: 100%;
    }
    .upload-zone {
      border: 2px dashed rgba(255,255,255,0.3);
      border-radius: 8px;
      padding: 30px;
      text-align: center;
      cursor: pointer;
      transition: 0.3s;
      margin-top: 15px;
    }
    .upload-zone:hover {
      border-color: var(--accent);
    }
    .upload-zone input {
      display: none;
    }
    .user-info {
      display: flex;
      align-items: center;
      gap: 20px;
      margin-bottom: 20px;
    }
    .user-avatar {
      width: 80px;
      height: 80px;
      border-radius: 50%;
      background: var(--accent);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 2rem;
    }
    .btn-secondary {
      background: transparent;
      border: 2px solid var(--accent);
      color: var(--accent);
      padding: 10px 20px;
      border-radius: 8px;
      cursor: pointer;
      transition: 0.3s;
      margin-top: 10px;
    }
    .btn-secondary:hover {
      background: var(--accent);
      color: white;
    }
  </style>
</head>
<body>

<header class="header">
    <div class="header-inner">
        <a href="index.html" class="logo">KINETIC<span class="accent">CRAFT</span></a>
        <nav class="nav">
            <a href="index.html" class="nav-link">Главная</a>
            <a href="download.html" class="nav-link">Скачать</a>
            <a href="changelog.html" class="nav-link">Обновления</a>
            <a href="reviews.html" class="nav-link">Отзывы</a>
            <a href="auth.html" class="nav-link">Вход</a>
        </nav>
        <button id="theme-toggle" class="theme-btn">
            <i class="fas fa-moon"></i>
        </button>
    </div>
</header>

<main class="page-wrapper container">
    <div class="col-12" data-aos="fade-down">
        <h1 class="page-title">Личный кабинет</h1>
    </div>

    <div class="profile-grid">
        <div class="profile-card" data-aos="fade-right">
            <h2><i class="fas fa-user"></i> Профиль</h2>
            <div class="user-info">
                <div class="user-avatar">
                    <i class="fas fa-user"></i>
                </div>
                <div>
                    <h3 id="username">Загрузка...</h3>
                    <p id="email" style="opacity: 0.7;">...</p>
                </div>
            </div>
            <button id="logout-btn" class="btn-secondary" style="width: 100%;">
                <i class="fas fa-sign-out-alt"></i> Выйти
            </button>
        </div>

        <div class="profile-card" data-aos="fade-left">
            <h2><i class="fas fa-tshirt"></i> Скин</h2>
            <div class="skin-viewer" id="skin-container">
                <canvas id="skin_canvas"></canvas>
            </div>
            <label class="upload-zone" for="skin-upload">
                <i class="fas fa-upload" style="font-size: 2rem; margin-bottom: 10px;"></i>
                <p>Перетащите сюда PNG скин (64x32)</p>
                <p style="font-size: 0.8rem; opacity: 0.6;">или нажмите для выбора</p>
                <input type="file" id="skin-upload" accept=".png,image/png">
            </label>
            <button id="reset-skin-btn" class="btn-secondary" style="width: 100%;">
                <i class="fas fa-undo"></i> Сбросить скин
            </button>
        </div>
    </div>

    <div class="col-12 glass-panel" data-aos="fade-up" style="margin-top: 20px;">
        <h3>Настройки</h3>
        <p style="opacity: 0.7;">Конфигурация лаунчера скоро будет доступна.</p>
    </div>
</main>

<footer class="main-footer">
    <div class="container">
        <div class="col-4 footer-info">
            <div class="logo">KINETIC<span>CRAFT</span></div>
            <p>Новое поколение лаунчеров.</p>
        </div>
        <div class="col-4 footer-nav">
            <h4>Навигация</h4>
            <a href="index.html">Главная</a>
            <a href="download.html">Скачать</a>
            <a href="changelog.html">Обновления</a>
            <a href="reviews.html">Отзывы</a>
            <a href="auth.html">Вход / Регистрация</a>
        </div>
        <div class="col-4 footer-social">
            <h4>Мы в сети</h4>
            <div class="social-icons">
                <a href="https://discord.gg/uEbjpB7WUd"><i class="fab fa-discord"></i></a>
                <a href="#"><i class="fab fa-vk"></i></a>
            </div>
        </div>
    </div>
</footer>

<script src="https://unpkg.com/aos@2.3.1/dist/aos.js"></script>
<script src="https://unpkg.com/skinview3d@3.0.0-alpha.1/dist/bundle.js"></script>
<script type="module">
import { createClient } from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js/+esm'

const supabaseUrl = 'https://enlcsziwdihbxtlvqxvv.supabase.co'
const supabaseKey = 'sb_publishable_QaAR-8mGn76W2qxzyucSOA_kKqDFsC0'
const supabase = createClient(supabaseUrl, supabaseKey)

let skinViewer = null

document.addEventListener('DOMContentLoaded', async () => {
    AOS.init()
    
    await checkAuth()
    initSkinViewer()
    setupEventListeners()
})

async function checkAuth() {
    const { data: { session } } = await supabase.auth.getSession()
    
    if (!session) {
        window.location.href = 'auth.html'
        return
    }
    
    document.getElementById('username').textContent = session.user.user_metadata?.nickname || session.user.email
    document.getElementById('email').textContent = session.user.email
    
    if (session.user.user_metadata?.skin_url) {
        loadSkin(session.user.user_metadata.skin_url)
    }
}

function initSkinViewer() {
    if (typeof skinview3d === 'undefined') {
        console.error('skinview3d не загружен')
        return
    }
    
    skinViewer = new skinview3d.SkinViewer({
        canvas: document.getElementById('skin_canvas'),
        width: document.getElementById('skin-container').clientWidth,
        height: 350,
        skin: 'https://upload.wikimedia.org/wikipedia/commons/8/85/Steve_%28Minecraft%29.png'
    })
    
    skinViewer.animations.add(skinview3d.IdleAnimation)
    skinViewer.controls.enableRotate = true
    
    document.getElementById('skin-container').addEventListener('click', () => {
        skinViewer.controls.enableRotate = true
    })
}

function loadSkin(url) {
    if (skinViewer) {
        skinViewer.skin = url
    }
}

function setupEventListeners() {
    const skinInput = document.getElementById('skin-upload')
    const resetBtn = document.getElementById('reset-skin-btn')
    const logoutBtn = document.getElementById('logout-btn')
    
    skinInput.addEventListener('change', async (e) => {
        const file = e.target.files[0]
        if (!file) return
        
        if (!file.name.endsWith('.png')) {
            alert('Нужен PNG файл!')
            return
        }
        
        await uploadSkin(file)
    })
    
    resetBtn.addEventListener('click', async () => {
        const { data: { session } } = await supabase.auth.getSession()
        if (!session) return
        
        const { error } = await supabase.from('profiles').upsert({
            id: session.user.id,
            skin_url: null
        })
        
        if (skinViewer) {
            skinViewer.skin = 'https://upload.wikimedia.org/wikipedia/commons/8/85/Steve_%28Minecraft%29.png'
        }
        
        alert('Скин сброшен')
    })
    
    logoutBtn.addEventListener('click', async () => {
        await supabase.auth.signOut()
        window.location.href = 'auth.html'
    })
}

async function uploadSkin(file) {
    const { data: { session } } = await supabase.auth.getSession()
    if (!session) return
    
    const fileName = `${session.user.id}.png`
    
    const { data, error } = await supabase.storage
        .from('skins')
        .upload(fileName, file, { upsert: true })
    
    if (error) {
        alert('Ошибка загрузки: ' + error.message)
        return
    }
    
    const { data: { publicUrl } } = supabase.storage.from('skins').getPublicUrl(fileName)
    
    await supabase.from('profiles').upsert({
        id: session.user.id,
        skin_url: publicUrl
    })
    
    loadSkin(publicUrl)
    alert('Скин обновлён!')
}
</script>
</body>
</html>
